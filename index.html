  <script>
    const audio = document.getElementById('audioTrack');
    const gestureOverlay = document.getElementById('gestureOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySubtitle = document.getElementById('overlaySubtitle');
    const streamStatus = document.getElementById('streamStatus');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const vinylDisc = document.getElementById('vinylDisc');
    const progressBar = document.getElementById('progressBar');
    const progressWrapper = document.getElementById('progressWrapper');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');
    const volumeSlider = document.getElementById('volumeSlider');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const eqBars = document.querySelectorAll('#eqContainer span');
    let eqInterval = null;

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function startVisualizer() {
      if (eqInterval) clearInterval(eqInterval);
      eqInterval = setInterval(() => {
        eqBars.forEach(bar => {
          const rand = Math.floor(Math.random() * 22) + 4;
          bar.style.height = `${rand}px`;
        });
      }, 140);
    }

    function stopVisualizer() {
      if (eqInterval) clearInterval(eqInterval);
      eqBars.forEach(bar => {
        bar.style.height = '4px';
      });
    }

    function updatePlaybackUI(isPlaying) {
      if (isPlaying) {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        vinylDisc.classList.remove('spin-paused');
        streamStatus.textContent = 'Playing';
        startVisualizer();
        // Hide overlay smoothly
        gestureOverlay.style.opacity = '0';
        setTimeout(() => {
          gestureOverlay.style.display = 'none';
        }, 300);
      } else {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        vinylDisc.classList.add('spin-paused');
        streamStatus.textContent = 'Paused';
        stopVisualizer();
      }
    }

    async function tryPlay() {
      try {
        streamStatus.textContent = 'Streaming...';
        await audio.play();
        updatePlaybackUI(true);
      } catch (err) {
        streamStatus.textContent = 'Ready';
        overlayTitle.textContent = "Tap to Listen";
        overlaySubtitle.textContent = "Tap the screen once to unlock browser audio";
      }
    }

    // Direct user tap on overlay
    gestureOverlay.addEventListener('click', () => {
      tryPlay();
    });

    playPauseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audio.paused) {
        tryPlay();
      } else {
        audio.pause();
        updatePlaybackUI(false);
      }
    });

    // Time & Progress
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = `${pct}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    progressWrapper.addEventListener('click', (e) => {
      const rect = progressWrapper.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (audio.duration) {
        audio.currentTime = (clickX / rect.width) * audio.duration;
      }
    });

    rewindBtn.addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    });

    forwardBtn.addEventListener('click', () => {
      if (audio.duration) {
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
      }
    });

    volumeSlider.addEventListener('input', (e) => {
      audio.volume = parseFloat(e.target.value);
    });

    audio.addEventListener('ended', () => {
      updatePlaybackUI(false);
      progressBar.style.width = '0%';
      currentTimeEl.textContent = '0:00';
    });

    // Handle network or stream errors gracefully
    audio.addEventListener('error', () => {
      streamStatus.textContent = 'Direct Stream';
      overlayTitle.textContent = "Stream Blocked";
      overlaySubtitle.innerHTML = '<a href="https://dl.dropboxusercontent.com/scl/fi/p6fhz17fqddtarpb1lb1e/Kangna-Tera-Ni-Lyrics-Abeer-Arora-7Alfaaz-Most-Viral-Song.mp3?rlkey=mkkeiyy88s4f8yzzuod2lwqsu" target="_blank" class="underline text-cyan-400">Click to open direct audio file</a>';
    });

    // Autoplay attempt on load
    window.addEventListener('load', () => {
      tryPlay();
    });
  </script>
</body>
</html>
