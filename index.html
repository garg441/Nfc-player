  <script>
    const audio = document.getElementById('audioTrack');
    const gestureOverlay = document.getElementById('gestureOverlay');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const vinylDisc = document.getElementById('vinylDisc');
    const progressBar = document.getElementById('progressBar');
    const progressWrapper = document.getElementById('progressWrapper');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');
    const volumeSlider = document.getElementById('volumeSlider');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const eqBars = document.querySelectorAll('#eqContainer span');
    let eqInterval = null;

    // Helper: format seconds to M:SS
    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Dynamic fake visualizer pulsing when audio plays
    function startVisualizer() {
      if (eqInterval) clearInterval(eqInterval);
      eqInterval = setInterval(() => {
        eqBars.forEach(bar => {
          const randHeight = Math.floor(Math.random() * 22) + 4;
          bar.style.height = `${randHeight}px`;
        });
      }, 140);
    }

    function stopVisualizer() {
      if (eqInterval) clearInterval(eqInterval);
      eqBars.forEach(bar => {
        bar.style.height = '4px';
      });
    }

    // Synchronize UI elements with playback state
    function updatePlaybackUI(isPlaying) {
      if (isPlaying) {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        vinylDisc.classList.remove('spin-paused');
        startVisualizer();
      } else {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        vinylDisc.classList.add('spin-paused');
        stopVisualizer();
      }
    }

    // Execute playback safely
    async function playAudio() {
      try {
        await audio.play();
        updatePlaybackUI(true);
        // Hide fallback overlay smoothly if visible
        gestureOverlay.classList.add('opacity-0');
        gestureOverlay.classList.remove('pointer-events-auto');
        gestureOverlay.classList.add('pointer-events-none');
      } catch (err) {
        // Autoplay policy prevented playback, activate fallback overlay
        showOverlay();
      }
    }

    function pauseAudio() {
      audio.pause();
      updatePlaybackUI(false);
    }

    function togglePlay() {
      if (audio.paused) {
        playAudio();
      } else {
        pauseAudio();
      }
    }

    // Show full-screen tap-to-play overlay when browser rejects zero-interaction autoplay
    function showOverlay() {
      gestureOverlay.classList.remove('pointer-events-none');
      gestureOverlay.classList.add('pointer-events-auto');
      gestureOverlay.classList.remove('opacity-0');
    }

    // --- Event Listeners ---
    
    // Play/Pause button
    playPauseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlay();
    });

    // Tap overlay to dismiss and play
    gestureOverlay.addEventListener('click', () => {
      playAudio();
    });

    // Time update for progress track
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = `${pct}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    // Metadata loaded
    audio.addEventListener('loadedmetadata', () => {
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    // Scrub progress
    progressWrapper.addEventListener('click', (e) => {
      const rect = progressWrapper.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      if (audio.duration) {
        audio.currentTime = (clickX / width) * audio.duration;
      }
    });

    // Skip controls
    rewindBtn.addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    });

    forwardBtn.addEventListener('click', () => {
      if (audio.duration) {
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
      }
    });

    // Volume Slider
    volumeSlider.addEventListener('input', (e) => {
      audio.volume = parseFloat(e.target.value);
    });

    // Reset UI when track ends
    audio.addEventListener('ended', () => {
      updatePlaybackUI(false);
      progressBar.style.width = '0%';
      currentTimeEl.textContent = '0:00';
    });

    // Immediate Autoplay Attempt upon page load
    window.addEventListener('load', () => {
      // Small timeout to allow browser DOM to mount completely
      setTimeout(() => {
        const promise = audio.play();
        if (promise !== undefined) {
          promise
            .then(() => {
              updatePlaybackUI(true);
            })
            .catch(() => {
              // Blocked by modern browser security policy -> display overlay
              showOverlay();
            });
        }
      }, 150);
    });
  </script>
</body>
</html>
