<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kangna Tera Ni - NFC Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #09090b 80%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow: hidden;
      position: relative;
    }

    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(168, 85, 247, 0.15) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(40px);
      top: 15%;
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 0.9; }
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      z-index: 10;
    }

    .tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    .record-wrap {
      position: relative;
      width: 190px;
      height: 190px;
      margin-bottom: 24px;
    }

    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #27272a 0%, #18181b 40%, #09090b 70%, #18181b 100%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 0 2px rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: spin 8s linear infinite;
      animation-play-state: paused;
    }

    .vinyl.playing {
      animation-play-state: running;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .vinyl-label {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: 3px solid #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .track-info {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }

    .track-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }

    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 24px;
      margin-bottom: 20px;
    }

    .bar {
      width: 3.5px;
      height: 6px;
      background: #6366f1;
      border-radius: 99px;
      transition: height 0.2s ease;
    }

    .playing .bar {
      animation: bounce 1.1s ease-in-out infinite alternate;
    }

    .playing .bar:nth-child(2) { animation-delay: 0.2s; }
    .playing .bar:nth-child(3) { animation-delay: 0.4s; }
    .playing .bar:nth-child(4) { animation-delay: 0.1s; }
    .playing .bar:nth-child(5) { animation-delay: 0.3s; }
    .playing .bar:nth-child(6) { animation-delay: 0.5s; }

    @keyframes bounce {
      0% { height: 6px; opacity: 0.4; }
      100% { height: 24px; opacity: 1; }
    }

    .timeline {
      width: 100%;
      margin-bottom: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 999px;
      transition: width 0.1s linear;
    }

    .timestamps {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-top: 6px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }

    .btn-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
      color: #ffffff;
      outline: none;
      transition: transform 0.15s ease;
    }

    .btn-circle:active {
      transform: scale(0.92);
    }

    .btn-circle svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    /* Autoplay Unlock Overlay */
    .tap-overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 9, 11, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: pointer;
    }

    .tap-pulse {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 0 35px rgba(37, 99, 235, 0.6);
      animation: pulsePlay 2s infinite;
    }

    @keyframes pulsePlay {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 20px rgba(37, 99, 235, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }

    .tap-overlay h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .tap-overlay p {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <!-- Tap Overlay to bypass mobile audio autoplay policy -->
  <div id="tapOverlay" class="tap-overlay" onclick="startPlayback()">
    <div class="tap-pulse">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="#ffffff" style="margin-left: 4px;">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </div>
    <div class="tag-badge">NFC Tag Linked</div>
    <h2>Tap to Listen</h2>
    <p>Tap anywhere to begin audio playback</p>
  </div>

  <div class="card">
    <div class="tag-badge">NFC Direct Audio</div>

    <div class="record-wrap">
      <div id="vinylDisc" class="vinyl">
        <div class="vinyl-label">KANGNA</div>
      </div>
    </div>

    <div class="track-info">
      <div class="track-title">Kangna Tera Ni</div>
      <div class="track-artist">Abeer Arora &bull; 7Alfaaz</div>
    </div>

    <div id="waveform" class="waveform">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="timeline">
      <div class="progress-bar" id="progressBar" onclick="seek(event)">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="timestamps">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn-circle" id="playBtn" onclick="togglePlay()">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>
  </div>

  <!-- Local Audio Source hosted directly in repo -->
  <audio id="audioPlayer" preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('audioPlayer');
    const overlay = document.getElementById('tapOverlay');
    const vinyl = document.getElementById('vinylDisc');
    const waveform = document.getElementById('waveform');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updateUI(playing) {
      if (playing) {
        vinyl.classList.add('playing');
        waveform.classList.add('playing');
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
      } else {
        vinyl.classList.remove('playing');
        waveform.classList.remove('playing');
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
      }
    }

    function startPlayback() {
      audio.play().then(() => {
        overlay.classList.add('hidden');
        updateUI(true);
      }).catch(err => {
        console.warn("Manual interaction error:", err);
      });
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => updateUI(true));
      } else {
        audio.pause();
        updateUI(false);
      }
    }

    function seek(e) {
      const rect = progressBar.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pos * audio.duration;
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      updateUI(false);
      progressFill.style.width = '0%';
    });

    // Attempt instant autoplay on NFC scan load
    window.addEventListener('load', () => {
      const promise = audio.play();
      if (promise !== undefined) {
        promise.then(() => {
          overlay.classList.add('hidden');
          updateUI(true);
        }).catch(() => {
          // Autoplay blocked by browser policy; user taps overlay to start
          overlay.classList.remove('hidden');
        });
      }
    });
  </script>
</body>
</html>
